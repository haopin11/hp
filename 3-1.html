<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>632 郝品</title>
</head>
<>
    <h2>HTML表单from</h2>
    <form action="http://huanqiu.com" name="hp">
        <p>
            用户名: <input type="text" name="username">
        </p>
        <p>
            密码: <input type="password" name="passwerd">
        </p>
        <p>
            性别: <input type="radio" name="sex" value="m">男
            <input type="radio" name="sex" value="f">女
            <!-- 保密 -->
             <input type="radio" name="sex" value="s">保密
        </p>
        <p>
            爱好: <input type="checkbox" name="hobby" value="1">篮球
            <input type="checkbox" name="hobby" value="2">足球
            <input type="checkbox" name="hobby" value="3">羽毛球
        </p>
        <!--籍贯 select -->
        <p>
           籍贯: <select name="native">
                  <option value="1"> selected>北京</option>//默认地址
                  <option value="2">上海</option>
                  <option value="3">广州</option>
                  <option value="4">内蒙古</option>
            </select>
        </p>
        <!-- 个人简介 textarea -->
        <p>
            个人简介: <textarea name="introduction" id="郝品" cols="30" rows="10"></textarea>
        </p>
        <!-- 出生日期 date-->
        <p>
            出生日期: <input type="date" name="birthday">
        </p>
        <!-- 多文件上传 file -->
        <p>
            多文件上传: <input type="file" name="files" multiple>
        </p>
        <!-- 提交按钮 -->
        <p>
            <input type="button" value="普通">
            <input type="submit" value="提交">
            <input type="reset" value="重置">
        </p>
    </form>
         <!-- 按钮 button-->
         <button type="submit">提交</button>
         <button> 表单外的按钮</button>
    </from>
</body>
</html>
