<!DOCTYPE html>
<!--
姓名：郝品
日期：2026-10-29
使用的大模型：deepseek-v4-pro
功能名称：JavaScript 数组主要方法可视化演示
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16-1 · JavaScript 数组方法可视化演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", "PingFang SC", "Segoe UI", sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            padding: 48px 16px;
        }
        .hp_container {
            max-width: 880px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
            overflow: hidden;
        }
        .hp_header {
            background: linear-gradient(135deg, #0f2027 0%, #2c5364 55%, #5f9ea0 100%);
            color: #fff;
            text-align: center;
            padding: 40px 24px 34px;
        }
        .hp_header h1 {
            font-size: 26px;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .hp_header p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
        }
        .hp_main {
            padding: 30px 28px 44px;
        }
        .hp_main h2 {
            font-size: 18px;
            color: #173f4f;
            margin: 28px 0 14px;
            padding-left: 12px;
            border-left: 5px solid #3b8d99;
        }
        .hp_main h2:first-child {
            margin-top: 0;
        }
        .hp_stage {
            background: #f6fbfc;
            border: 1px solid #e4eef1;
            border-radius: 14px;
            padding: 18px 16px;
            margin-bottom: 6px;
        }
        .hp_stage .hp_label {
            font-size: 12px;
            color: #7a9aa3;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        .hp_chips {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            min-height: 54px;
            align-items: center;
        }
        .hp_chip {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            padding: 16px 18px;
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
            animation: hp_pop 0.28s ease;
        }
        .hp_chip .hp_idx {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            background: #173f4f;
            color: #fff;
            font-style: normal;
            font-size: 10px;
            font-weight: 400;
            padding: 1px 6px;
            border-radius: 999px;
        }
        .hp_empty2 {
            color: #9db8bf;
            font-size: 14px;
            font-style: italic;
        }
        .hp_btn_bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .hp_btn {
            background: #eef6f7;
            border: 1px solid #d6e8eb;
            color: #3b8d99;
            border-radius: 999px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .hp_btn:hover {
            background: #3b8d99;
            border-color: #3b8d99;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(59, 141, 153, 0.35);
        }
        .hp_btn.hp_reset {
            background: #fff3e0;
            border-color: #f0d7a6;
            color: #d98324;
        }
        .hp_btn.hp_reset:hover {
            background: #e2762b;
            border-color: #e2762b;
            color: #fff;
            box-shadow: 0 6px 14px rgba(226, 118, 43, 0.35);
        }
        .hp_code {
            background: #173f4f;
            color: #d7eef1;
            border-radius: 12px;
            padding: 14px 18px;
            font-family: Consolas, "Courier New", monospace;
            font-size: 14px;
            line-height: 1.7;
            overflow-x: auto;
            margin-bottom: 12px;
        }
        .hp_code .hp_kw {
            color: #ffd479;
        }
        .hp_code .hp_num {
            color: #9cdcfe;
        }
        .hp_code .hp_str {
            color: #ce9178;
        }
        .hp_code .hp_cmt {
            color: #7a9aa3;
        }
        .hp_result {
            background: #f6fbfc;
            border: 1px solid #e4eef1;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 14px;
            color: #173f4f;
            line-height: 1.8;
        }
        .hp_result b {
            color: #2b7de9;
        }
        .hp_footer {
            text-align: center;
            padding: 18px 24px;
            background: #f0f7f8;
            color: #5f7f88;
            font-size: 13px;
            border-top: 1px solid #e0edef;
        }
        @keyframes hp_pop {
            from {
                transform: scale(0.5);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="hp_container">
        <div class="hp_header">
            <h1>JavaScript 数组方法</h1>
            <p>点击下方按钮，观察数组的实时变化</p>
        </div>

        <div class="hp_main">
            <h2>可视化数组</h2>
            <div class="hp_stage">
                <div class="hp_label">当前数组 hp_arr（灰色小字为下标）</div>
                <div class="hp_chips" id="hp_arrBox"></div>
            </div>
            <div class="hp_stage">
                <div class="hp_label">方法返回结果</div>
                <div class="hp_chips" id="hp_resultBox"></div>
            </div>

            <h2>一、增删元素</h2>
            <div class="hp_btn_bar">
                <button class="hp_btn" data-hp="push">push() 末尾追加</button>
                <button class="hp_btn" data-hp="pop">pop() 末尾删除</button>
                <button class="hp_btn" data-hp="unshift">unshift() 头部插入</button>
                <button class="hp_btn" data-hp="shift">shift() 头部删除</button>
                <button class="hp_btn" data-hp="splice">splice() 任意增删</button>
            </div>

            <h2>二、截取与合并</h2>
            <div class="hp_btn_bar">
                <button class="hp_btn" data-hp="slice">slice() 截取</button>
                <button class="hp_btn" data-hp="concat">concat() 合并</button>
                <button class="hp_btn" data-hp="join">join() 拼接</button>
            </div>

            <h2>三、查找元素</h2>
            <div class="hp_btn_bar">
                <button class="hp_btn" data-hp="indexOf">indexOf() 查下标</button>
                <button class="hp_btn" data-hp="includes">includes() 是否存在</button>
            </div>

            <h2>四、遍历与变换</h2>
            <div class="hp_btn_bar">
                <button class="hp_btn" data-hp="forEach">forEach() 遍历</button>
                <button class="hp_btn" data-hp="map">map() 映射</button>
                <button class="hp_btn" data-hp="filter">filter() 过滤</button>
                <button class="hp_btn" data-hp="reduce">reduce() 累加</button>
            </div>

            <h2>五、排序与反转</h2>
            <div class="hp_btn_bar">
                <button class="hp_btn" data-hp="sort">sort() 排序</button>
                <button class="hp_btn" data-hp="reverse">reverse() 反转</button>
                <button class="hp_btn hp_reset" data-hp="reset">重置数组</button>
            </div>

            <h2>当前操作</h2>
            <div class="hp_code" id="hp_codeBox">点击上方任意按钮查看对应代码与结果</div>
            <div class="hp_result" id="hp_outBox">请先点击一个数组方法开始演示……</div>
        </div>

        <div class="hp_footer">
            © 2026 郝品 | 高级网页设计课程作业
        </div>
    </div>

    <script>
        var hp_arrBox = document.getElementById('hp_arrBox');
        var hp_resultBox = document.getElementById('hp_resultBox');
        var hp_codeBox = document.getElementById('hp_codeBox');
        var hp_outBox = document.getElementById('hp_outBox');

        var hp_arr = ['HTML', 'CSS', 'JavaScript', 'Vue', 'React'];
        var hp_origin = hp_arr.slice();
        var hp_palette = ['#2b7de9', '#3b8d99', '#8e5cf7', '#e2762b', '#2ba84a', '#d6446e', '#d9a326', '#5f9ea0'];

        function hp_chipHtml(value, index) {
            var hp_color = hp_palette[index % hp_palette.length];
            return '<span class="hp_chip" style="background:' + hp_color + '">' +
                '<i class="hp_idx">' + index + '</i>' + value + '</span>';
        }

        function hp_renderArr() {
            var hp_html = '';
            if (hp_arr.length === 0) {
                hp_html = '<span class="hp_empty2">（空数组）</span>';
            } else {
                for (var hp_i = 0; hp_i < hp_arr.length; hp_i++) {
                    hp_html += hp_chipHtml(hp_arr[hp_i], hp_i);
                }
            }
            hp_arrBox.innerHTML = hp_html;
        }

        function hp_renderResult(arr, text) {
            if (arr !== null) {
                var hp_html = '';
                if (arr.length === 0) {
                    hp_html = '<span class="hp_empty2">（空数组）</span>';
                } else {
                    for (var hp_j = 0; hp_j < arr.length; hp_j++) {
                        hp_html += hp_chipHtml(arr[hp_j], hp_j);
                    }
                }
                hp_resultBox.innerHTML = hp_html;
                hp_outBox.innerHTML = text;
            } else {
                hp_resultBox.innerHTML = '<span class="hp_empty2">（无数组返回）</span>';
                hp_outBox.innerHTML = '<b>返回结果：</b>' + text;
            }
        }

        function hp_show(codeHtml, arr, text) {
            hp_codeBox.innerHTML = codeHtml;
            hp_renderResult(arr, text);
        }

        function hp_actions(name) {
            var hp_code = '', hp_arrResult = null, hp_text = '';
            if (name === 'push') {
                hp_arr.push('Node.js');
                hp_code = '<span class="hp_kw">hp_arr</span>.push(<span class="hp_str">"Node.js"</span>);';
                hp_text = '在末尾追加了 <b>Node.js</b>，数组长度变为 <b>' + hp_arr.length + '</b>。';
            } else if (name === 'pop') {
                var hp_removed = hp_arr.pop();
                hp_code = '<span class="hp_kw">hp_arr</span>.pop();';
                hp_text = '删除了末尾元素 <b>' + hp_removed + '</b>，剩余 <b>' + hp_arr.length + '</b> 个。';
                hp_arrResult = [];
            } else if (name === 'unshift') {
                hp_arr.unshift('TypeScript');
                hp_code = '<span class="hp_kw">hp_arr</span>.unshift(<span class="hp_str">"TypeScript"</span>);';
                hp_text = '在头部插入了 <b>TypeScript</b>，原元素整体后移。';
            } else if (name === 'shift') {
                var hp_removed2 = hp_arr.shift();
                hp_code = '<span class="hp_kw">hp_arr</span>.shift();';
                hp_text = '删除了头部元素 <b>' + hp_removed2 + '</b>。';
                hp_arrResult = [];
            } else if (name === 'splice') {
                hp_code = '<span class="hp_kw">hp_arr</span>.splice(<span class="hp_num">2</span>, <span class="hp_num">1</span>, <span class="hp_str">"Sass"</span>);';
                hp_arr.splice(2, 1, 'Sass');
                hp_text = '从下标 2 起删除 1 个元素，并插入 <b>Sass</b>。';
            } else if (name === 'slice') {
                hp_code = '<span class="hp_kw">hp_arr</span>.slice(<span class="hp_num">1</span>, <span class="hp_num">3</span>);';
                hp_arrResult = hp_arr.slice(1, 3);
                hp_text = '截取下标 [1, 3) 之间的元素，<b>不修改</b>原数组。';
            } else if (name === 'concat') {
                hp_code = '<span class="hp_kw">hp_arr</span>.concat([<span class="hp_str">"Vue"</span>, <span class="hp_str">"React"</span>]);';
                hp_arrResult = hp_arr.concat(['Vue', 'React']);
                hp_text = '合并了两个数组，返回 <b>新数组</b>，原数组不变。';
            } else if (name === 'join') {
                hp_code = '<span class="hp_kw">hp_arr</span>.join(<span class="hp_str">" · "</span>);';
                var hp_joined = hp_arr.join(' · ');
                hp_arrResult = null;
                hp_text = '用分隔符拼接成字符串：' + hp_joined;
            } else if (name === 'indexOf') {
                hp_code = '<span class="hp_kw">hp_arr</span>.indexOf(<span class="hp_str">"JavaScript"</span>);';
                var hp_index = hp_arr.indexOf('JavaScript');
                hp_arrResult = null;
                hp_text = '"JavaScript" 的下标为 <b>' + hp_index + '</b>（找不到时返回 -1）。';
            } else if (name === 'includes') {
                hp_code = '<span class="hp_kw">hp_arr</span>.includes(<span class="hp_str">"Python"</span>);';
                var hp_has = hp_arr.includes('Python');
                hp_arrResult = null;
                hp_text = '是否包含 "Python"：<b>' + hp_has + '</b>。';
            } else if (name === 'forEach') {
                hp_code = '<span class="hp_kw">hp_arr</span>.forEach(<span class="hp_kw">function</span>(v){ console.log(v); });';
                var hp_items = hp_arr.join('、');
                hp_arrResult = null;
                hp_text = '逐个遍历了每个元素：' + hp_items + '。';
            } else if (name === 'map') {
                hp_code = '<span class="hp_kw">hp_arr</span>.map(<span class="hp_kw">function</span>(v){ <span class="hp_kw">return</span> v + <span class="hp_str">"!"</span>; });';
                hp_arrResult = hp_arr.map(function (v) { return v + '!'; });
                hp_text = '对每个元素做映射，返回 <b>新数组</b>，原数组不变。';
            } else if (name === 'filter') {
                hp_code = '<span class="hp_kw">hp_arr</span>.filter(<span class="hp_kw">function</span>(v){ <span class="hp_kw">return</span> v.length &gt; <span class="hp_num">3</span>; });';
                hp_arrResult = hp_arr.filter(function (v) { return v.length > 3; });
                hp_text = '筛选出长度大于 3 的元素，返回 <b>新数组</b>。';
            } else if (name === 'reduce') {
                hp_code = '<span class="hp_kw">hp_arr</span>.reduce(<span class="hp_kw">function</span>(s, v){ <span class="hp_kw">return</span> s + v.length; }, <span class="hp_num">0</span>);';
                var hp_totalLen = hp_arr.reduce(function (s, v) { return s + v.length; }, 0);
                hp_arrResult = null;
                hp_text = '累加所有元素字符长度，总和为 <b>' + hp_totalLen + '</b>。';
            } else if (name === 'sort') {
                hp_code = '<span class="hp_kw">hp_arr</span>.sort();';
                hp_arr.sort();
                hp_text = '按字符串默认规则排序，<b>直接修改</b>原数组。';
            } else if (name === 'reverse') {
                hp_code = '<span class="hp_kw">hp_arr</span>.reverse();';
                hp_arr.reverse();
                hp_text = '数组顺序被反转。';
            } else if (name === 'reset') {
                hp_arr = hp_origin.slice();
                hp_code = '<span class="hp_kw">hp_arr</span> = [<span class="hp_str">"HTML"</span>, <span class="hp_str">"CSS"</span>, <span class="hp_str">"JavaScript"</span>, <span class="hp_str">"Vue"</span>, <span class="hp_str">"React"</span>];';
                hp_arrResult = hp_arr.slice();
                hp_text = '数组已恢复到初始状态。';
            }
            hp_renderArr();
            hp_show(hp_code, hp_arrResult, hp_text);
        }

        var hp_btns = document.querySelectorAll('.hp_btn');
        for (var hp_k = 0; hp_k < hp_btns.length; hp_k++) {
            hp_btns[hp_k].addEventListener('click', function () {
                hp_actions(this.getAttribute('data-hp'));
            });
        }

        hp_renderArr();
    </script>
</body>
</html>
