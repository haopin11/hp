<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>郝品的JavaScript</h2>
    <script>
        document.write("<h3>hello world,郝品</h3>");
        alert("hello world");
        console.log("hello world,haopin");
        //prompt和confirm
        var name = prompt("请输入您的姓名");
        alert("您的姓名是："+ name);
        var age = confirm("您确定是18岁以上吗？");
        if(age){
            document.write("您是18岁以上");
        }else{
            document.write("您不是18岁以上");
        }
    </script>
