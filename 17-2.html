<!DOCTYPE html>
<!--
姓名：郝品
日期：2026-11-02
使用的大模型：deepseek-v4-pro
功能名称：fetch 跨域接口数据获取与展示
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17-2 · fetch 跨域请求数据</title>
    <link rel="stylesheet" href="font/iconfont.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", "PingFang SC", "Segoe UI", sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            padding: 40px 16px;
        }
        .hp_container {
            max-width: 920px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
            overflow: hidden;
        }
        .hp_header {
            background: linear-gradient(135deg, #0f2027 0%, #2c5364 55%, #5f9ea0 100%);
            color: #fff;
            text-align: center;
            padding: 34px 24px 28px;
        }
        .hp_header h1 {
            font-size: 25px;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .hp_header p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.78);
            line-height: 1.8;
        }
        .hp_header code {
            display: inline-block;
            margin-top: 8px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 8px;
            padding: 5px 12px;
            font-family: Consolas, "Courier New", monospace;
            font-size: 13px;
            color: #ffd479;
        }
        .hp_main {
            padding: 26px 28px 40px;
        }
        .hp_toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 18px;
        }
        .hp_search {
            position: relative;
            flex: 1;
            min-width: 220px;
        }
        .hp_search .iconfont {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #9db8bf;
            font-size: 16px;
        }
        .hp_search input {
            width: 100%;
            border: 1px solid #d6e8eb;
            border-radius: 999px;
            padding: 10px 14px 10px 34px;
            font-size: 14px;
            color: #173f4f;
            outline: none;
            transition: border-color 0.15s;
        }
        .hp_search input:focus {
            border-color: #3b8d99;
        }
        .hp_btn {
            background: #3b8d99;
            border: 1px solid #3b8d99;
            color: #fff;
            border-radius: 999px;
            padding: 10px 22px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .hp_btn:hover {
            background: #2c7180;
            border-color: #2c7180;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(59, 141, 153, 0.35);
        }
        .hp_btn:disabled {
            background: #b9cfd3;
            border-color: #b9cfd3;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .hp_status {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
            background: #f6fbfc;
            border: 1px solid #e4eef1;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 13px;
            color: #5f7f88;
            margin-bottom: 16px;
        }
        .hp_status b {
            color: #2b7de9;
        }
        .hp_dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2ba84a;
            margin-right: 6px;
            vertical-align: middle;
        }
        .hp_dot.hp_err {
            background: #d6446e;
        }
        .hp_dot.hp_wait {
            background: #d9a326;
        }
        .hp_error {
            display: none;
            background: #fff1f4;
            border: 1px solid #f6c9d5;
            color: #b5294d;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 16px;
        }
        .hp_grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }
        .hp_card {
            background: #fff;
            border: 1px solid #e4eef1;
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
            animation: hp_fade 0.3s ease;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .hp_card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 24px rgba(23, 63, 79, 0.16);
            border-color: #a9cfd5;
        }
        .hp_top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .hp_avatar {
            flex: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            background: linear-gradient(135deg, #3b8d99, #2b7de9);
            border: 2px solid #e4eef1;
        }
        .hp_name {
            font-size: 16px;
            font-weight: 700;
            color: #173f4f;
        }
        .hp_uname {
            font-size: 12px;
            color: #9db8bf;
        }
        .hp_row {
            display: flex;
            font-size: 13px;
            line-height: 2;
            color: #4a6a73;
        }
        .hp_row span {
            flex: none;
            width: 46px;
            color: #7a9aa3;
        }
        .hp_row em {
            flex: 1;
            font-style: normal;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .hp_row a {
            color: #2b7de9;
            text-decoration: none;
        }
        .hp_row a:hover {
            text-decoration: underline;
        }
        .hp_skeleton {
            height: 168px;
            border-radius: 14px;
            background: linear-gradient(100deg, #eef5f7 30%, #f8fbfc 50%, #eef5f7 70%);
            background-size: 200% 100%;
            animation: hp_shine 1.1s linear infinite;
        }
        .hp_empty {
            grid-column: 1 / -1;
            text-align: center;
            color: #9db8bf;
            font-size: 14px;
            padding: 30px 0;
        }
        .hp_footer {
            text-align: center;
            padding: 16px 24px;
            background: #f0f7f8;
            color: #5f7f88;
            font-size: 13px;
            border-top: 1px solid #e0edef;
        }
        @keyframes hp_fade {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes hp_shine {
            from { background-position: 100% 0; }
            to { background-position: -100% 0; }
        }
    </style>
</head>
<body>
    <div class="hp_container">
        <div class="hp_header">
            <h1>fetch 跨域接口数据展示</h1>
            <p>使用原生 fetch 请求支持 CORS 的公开接口，获取用户列表数据并渲染到页面</p>
            <code>GET https://api.github.com/users?per_page=12</code>
        </div>

        <div class="hp_main">
            <div class="hp_toolbar">
                <div class="hp_search">
                    <i class="iconfont icon-sousuo"></i>
                    <input type="text" id="hp_keyword" placeholder="按账号 / 类型筛选">
                </div>
                <button class="hp_btn" id="hp_reload">重新请求数据</button>
            </div>

            <div class="hp_status" id="hp_status">
                <span><i class="hp_dot hp_wait" id="hp_dot"></i><b id="hp_state">准备请求……</b></span>
                <span>接口状态：<b id="hp_code">--</b></span>
                <span>数据量：<b id="hp_count">0</b> 条</span>
                <span>耗时：<b id="hp_time">0</b> ms</span>
            </div>

            <div class="hp_error" id="hp_error"></div>

            <div class="hp_grid" id="hp_grid">
                <div class="hp_skeleton"></div>
                <div class="hp_skeleton"></div>
                <div class="hp_skeleton"></div>
                <div class="hp_skeleton"></div>
                <div class="hp_skeleton"></div>
                <div class="hp_skeleton"></div>
            </div>
        </div>

        <div class="hp_footer">
            © 2026 郝品 | 高级网页设计课程作业
        </div>
    </div>

    <script>
        var hp_url = 'https://api.github.com/users?per_page=12';

        var hp_grid = document.getElementById('hp_grid');
        var hp_error = document.getElementById('hp_error');
        var hp_state = document.getElementById('hp_state');
        var hp_code = document.getElementById('hp_code');
        var hp_count = document.getElementById('hp_count');
        var hp_time = document.getElementById('hp_time');
        var hp_dot = document.getElementById('hp_dot');
        var hp_reload = document.getElementById('hp_reload');
        var hp_keyword = document.getElementById('hp_keyword');

        var hp_users = [];

        function hp_escape(hp_str) {
            return String(hp_str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function hp_cardHtml(hp_u) {
            return '<div class="hp_card">' +
                '<div class="hp_top">' +
                    '<img class="hp_avatar" src="' + hp_escape(hp_u.avatar_url) + '" alt="' + hp_escape(hp_u.login) + '">' +
                    '<div>' +
                        '<div class="hp_name">' + hp_escape(hp_u.login) + '</div>' +
                        '<div class="hp_uname">ID：' + hp_escape(hp_u.id) + '</div>' +
                    '</div>' +
                '</div>' +
                '<div class="hp_row"><span>类型</span><em>' + hp_escape(hp_u.type) + '</em></div>' +
                '<div class="hp_row"><span>节点</span><em>' + hp_escape(hp_u.node_id) + '</em></div>' +
                '<div class="hp_row"><span>管理员</span><em>' + (hp_u.site_admin ? '是' : '否') + '</em></div>' +
                '<div class="hp_row"><span>主页</span><em><a href="' + hp_escape(hp_u.html_url) + '" target="_blank">' + hp_escape(hp_u.html_url) + '</a></em></div>' +
                '</div>';
        }

        function hp_render() {
            var hp_kw = hp_keyword.value.trim().toLowerCase();
            var hp_list = hp_users.filter(function (hp_u) {
                if (hp_kw === '') {
                    return true;
                }
                return (hp_u.login + ' ' + hp_u.type + ' ' + hp_u.id).toLowerCase().indexOf(hp_kw) > -1;
            });
            if (hp_list.length === 0) {
                hp_grid.innerHTML = '<div class="hp_empty">没有匹配的数据</div>';
                return;
            }
            var hp_html = '';
            for (var hp_i = 0; hp_i < hp_list.length; hp_i++) {
                hp_html += hp_cardHtml(hp_list[hp_i]);
            }
            hp_grid.innerHTML = hp_html;
        }

        function hp_loading() {
            hp_dot.className = 'hp_dot hp_wait';
            hp_state.innerHTML = '正在请求接口……';
            hp_error.style.display = 'none';
            hp_reload.disabled = true;
            var hp_sk = '';
            for (var hp_i = 0; hp_i < 6; hp_i++) {
                hp_sk += '<div class="hp_skeleton"></div>';
            }
            hp_grid.innerHTML = hp_sk;
        }

        function hp_loadData() {
            hp_loading();
            var hp_start = new Date().getTime();

            fetch(hp_url, {
                method: 'GET',
                headers: { 'Accept': 'application/json' }
            }).then(function (hp_res) {
                hp_code.innerHTML = hp_res.status + ' ' + hp_res.statusText;
                if (!hp_res.ok) {
                    throw new Error('接口返回异常，状态码 ' + hp_res.status);
                }
                return hp_res.json();
            }).then(function (hp_data) {
                hp_users = hp_data;
                hp_time.innerHTML = new Date().getTime() - hp_start;
                hp_count.innerHTML = hp_users.length;
                hp_dot.className = 'hp_dot';
                hp_state.innerHTML = '接口数据获取成功（跨域请求完成）';
                hp_render();
            }).catch(function (hp_err) {
                hp_dot.className = 'hp_dot hp_err';
                hp_state.innerHTML = '接口请求失败';
                hp_count.innerHTML = 0;
                hp_error.style.display = 'block';
                hp_error.innerHTML = '请求失败：' + hp_escape(hp_err.message) +
                    '<br>可能原因：网络未连接、接口不可用或被浏览器拦截（GitHub 未登录接口每小时限 60 次请求，超限会返回 403）。' +
                    '可检查控制台 Network 面板，或稍后点击“重新请求数据”重试。';
                hp_grid.innerHTML = '<div class="hp_empty">暂无数据</div>';
            }).then(function () {
                hp_reload.disabled = false;
            });
        }

        hp_reload.addEventListener('click', hp_loadData);
        hp_keyword.addEventListener('input', hp_render);

        hp_loadData();
    </script>
</body>
</html>
