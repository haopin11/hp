<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>632 郝品</title>
    <style>
        p{
            color: rgb(43, 63, 174);
            font-size: 20px;
        }
        /* 标签选择器 */
        #box{
            width: 600px;
            height: 500px;
            background-color: rgb(17, 132, 194);
        }
    /* id 选择器 以#开头 */
    .n1{
        color: rgb(172, 16, 177);
    }
    .n2{
        color: rgb(230, 126, 34);
    }
    /* h2 黑底白字 */
    h2{
        background-color: black;
        color: white;
    }
    /* 新增 300x300 盒子 */
    #box2{
        width: 300px;
        height: 300px;
        background-color: rgb(39, 174, 96);
    }
    /* 选择器文字白色 */
    .white{
        color: white;
    }
    /* CSS 文字黑色 */
    .black{
        color: black;
    }
       </style>
</head>
<body>
    <h2>层叠样式表 CSS</h2>
    <div id="box">
        <p class="white"><span class="black">CSS</span>选择器</p>
        <p><span class="n1">郝</span><span class="n2">品</span></p>
        <p>CSS属性</p>
    </div>
    <div id="box2"></div>
    <!-- 名字每个颜色不同，在同一行-->
    <!-- h2黑底白字-->
    <!-- 选择器是白色-->
</body>
</html>
