<!DOCTYPE html>
<!--
姓名：郝品
日期：2026-11-02
使用的大模型：deepseek-v4-pro
功能名称：商品列表（fetch 接口数据）
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17-3 · 商品列表</title>
    <link rel="stylesheet" href="font/iconfont.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", "PingFang SC", "Segoe UI", sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            padding: 40px 16px;
        }
        .hp_container {
            max-width: 1080px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
            overflow: hidden;
        }
        .hp_header {
            background: linear-gradient(135deg, #0f2027 0%, #2c5364 55%, #5f9ea0 100%);
            color: #fff;
            text-align: center;
            padding: 34px 24px 28px;
        }
        .hp_header h1 {
            font-size: 25px;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .hp_header p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.78);
            line-height: 1.8;
        }
        .hp_header code {
            display: inline-block;
            margin-top: 8px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 8px;
            padding: 5px 12px;
            font-family: Consolas, "Courier New", monospace;
            font-size: 13px;
            color: #ffd479;
        }
        .hp_main {
            padding: 26px 28px 40px;
        }
        .hp_toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 18px;
        }
        .hp_search {
            position: relative;
            flex: 1;
            min-width: 220px;
        }
        .hp_search .iconfont {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #9db8bf;
            font-size: 16px;
        }
        .hp_search input {
            width: 100%;
            border: 1px solid #d6e8eb;
            border-radius: 999px;
            padding: 10px 14px 10px 34px;
            font-size: 14px;
            color: #173f4f;
            outline: none;
            transition: border-color 0.15s;
        }
        .hp_search input:focus {
            border-color: #3b8d99;
        }
        .hp_btn {
            background: #3b8d99;
            border: 1px solid #3b8d99;
            color: #fff;
            border-radius: 999px;
            padding: 10px 22px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .hp_btn:hover {
            background: #2c7180;
            border-color: #2c7180;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(59, 141, 153, 0.35);
        }
        .hp_btn:disabled {
            background: #b9cfd3;
            border-color: #b9cfd3;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .hp_status {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
            background: #f6fbfc;
            border: 1px solid #e4eef1;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 13px;
            color: #5f7f88;
            margin-bottom: 16px;
        }
        .hp_status b {
            color: #2b7de9;
        }
        .hp_dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2ba84a;
            margin-right: 6px;
            vertical-align: middle;
        }
        .hp_dot.hp_err {
            background: #d6446e;
        }
        .hp_dot.hp_wait {
            background: #d9a326;
        }
        .hp_error {
            display: none;
            background: #fff1f4;
            border: 1px solid #f6c9d5;
            color: #b5294d;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 16px;
        }
        .hp_grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }
        .hp_card {
            background: #fff;
            border: 1px solid #e4eef1;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
            animation: hp_fade 0.3s ease;
            transition: transform 0.15s, box-shadow 0.15s;
            display: flex;
            flex-direction: column;
        }
        .hp_card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 24px rgba(23, 63, 79, 0.16);
            border-color: #a9cfd5;
        }
        .hp_thumb {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background: #eef5f7;
            display: block;
        }
        .hp_body {
            padding: 14px 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }
        .hp_title {
            font-size: 15px;
            font-weight: 700;
            color: #173f4f;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 42px;
        }
        .hp_cat {
            font-size: 12px;
            color: #7a9aa3;
        }
        .hp_price_row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-top: 2px;
        }
        .hp_price {
            font-size: 20px;
            font-weight: 700;
            color: #e2762b;
        }
        .hp_price_old {
            font-size: 12px;
            color: #b3c3c8;
            text-decoration: line-through;
        }
        .hp_discount {
            font-size: 12px;
            color: #d6446e;
            font-weight: 700;
        }
        .hp_meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #7a9aa3;
        }
        .hp_rating {
            color: #d9a326;
            font-weight: 700;
        }
        .hp_more {
            margin-top: 10px;
            display: inline-block;
            text-align: center;
            background: #eef6f7;
            color: #3b8d99;
            border: 1px solid #d6e8eb;
            border-radius: 999px;
            padding: 7px 0;
            font-size: 13px;
            text-decoration: none;
            transition: all 0.15s;
        }
        .hp_more:hover {
            background: #3b8d99;
            border-color: #3b8d99;
            color: #fff;
        }
        .hp_skeleton {
            height: 300px;
            border-radius: 14px;
            background: linear-gradient(100deg, #eef5f7 30%, #f8fbfc 50%, #eef5f7 70%);
            background-size: 200% 100%;
            animation: hp_shine 1.1s linear infinite;
        }
        .hp_empty {
            grid-column: 1 / -1;
            text-align: center;
            color: #9db8bf;
            font-size: 14px;
            padding: 30px 0;
        }
        .hp_footer {
            text-align: center;
            padding: 16px 24px;
            background: #f0f7f8;
            color: #5f7f88;
            font-size: 13px;
            border-top: 1px solid #e0edef;
        }
        @keyframes hp_fade {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes hp_shine {
            from { background-position: 100% 0; }
            to { background-position: -100% 0; }
        }
    </style>
</head>
<body>
    <div class="hp_container">
        <div class="hp_header">
            <h1>商品列表 · fetch 接口数据</h1>
            <p>使用原生 fetch 请求 dummyjson 商品接口，获取默认商品列表并渲染</p>
            <code>GET https://dummyjson.com/products?limit=8</code>
        </div>

        <div class="hp_main">
            <div class="hp_toolbar">
                <div class="hp_search">
                    <i class="iconfont icon-sousuo"></i>
                    <input type="text" id="hp_keyword" placeholder="按商品名 / 分类 / 品牌筛选">
                </div>
                <button class="hp_btn" id="hp_reload">重新请求数据</button>
            </div>

            <div class="hp_status" id="hp_status">
                <span><i class="hp_dot hp_wait" id="hp_dot"></i><b id="hp_state">准备请求……</b></span>
                <span>接口状态：<b id="hp_code">--</b></span>
                <span>商品数：<b id="hp_count">0</b> 条</span>
                <span>耗时：<b id="hp_time">0</b> ms</span>
            </div>

            <div class="hp_error" id="hp_error"></div>

            <div class="hp_grid" id="hp_grid">
                <div class="hp_skeleton"></div>
                <div class="hp_skeleton"></div>
                <div class="hp_skeleton"></div>
                <div class="hp_skeleton"></div>
                <div class="hp_skeleton"></div>
                <div class="hp_skeleton"></div>
                <div class="hp_skeleton"></div>
                <div class="hp_skeleton"></div>
            </div>
        </div>

        <div class="hp_footer">
            © 2026 郝品 | 高级网页设计课程作业
        </div>
    </div>

    <script>
        var hp_url = 'https://dummyjson.com/products?limit=8';

        var hp_grid = document.getElementById('hp_grid');
        var hp_error = document.getElementById('hp_error');
        var hp_state = document.getElementById('hp_state');
        var hp_code = document.getElementById('hp_code');
        var hp_count = document.getElementById('hp_count');
        var hp_time = document.getElementById('hp_time');
        var hp_dot = document.getElementById('hp_dot');
        var hp_reload = document.getElementById('hp_reload');
        var hp_keyword = document.getElementById('hp_keyword');

        var hp_products = [];

        function hp_escape(hp_str) {
            return String(hp_str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function hp_price(hp_n) {
            return '$' + Number(hp_n).toFixed(2);
        }

        function hp_cardHtml(hp_p) {
            return '<div class="hp_card">' +
                '<img class="hp_thumb" src="' + hp_escape(hp_p.thumbnail) + '" alt="' + hp_escape(hp_p.title) + '">' +
                '<div class="hp_body">' +
                    '<div class="hp_title">' + hp_escape(hp_p.title) + '</div>' +
                    '<div class="hp_cat">' + hp_escape(hp_p.category) + ' · ' + hp_escape(hp_p.brand) + '</div>' +
                    '<div class="hp_price_row">' +
                        '<span class="hp_price">' + hp_price(hp_p.price) + '</span>' +
                        '<span class="hp_discount">-' + hp_p.discountPercentage + '%</span>' +
                    '</div>' +
                    '<div class="hp_meta">' +
                        '<span>库存 ' + hp_p.stock + '</span>' +
                        '<span class="hp_rating">★ ' + hp_p.rating + '</span>' +
                    '</div>' +
                    '<a class="hp_more" href="17-3.detail.html?id=' + hp_p.id + '">查看详情</a>' +
                '</div>' +
                '</div>';
        }

        function hp_render() {
            var hp_kw = hp_keyword.value.trim().toLowerCase();
            var hp_list = hp_products.filter(function (hp_p) {
                if (hp_kw === '') {
                    return true;
                }
                return (hp_p.title + ' ' + hp_p.category + ' ' + hp_p.brand + ' ' + hp_p.id)
                    .toLowerCase().indexOf(hp_kw) > -1;
            });
            if (hp_list.length === 0) {
                hp_grid.innerHTML = '<div class="hp_empty">没有匹配的商品</div>';
                return;
            }
            var hp_html = '';
            for (var hp_i = 0; hp_i < hp_list.length; hp_i++) {
                hp_html += hp_cardHtml(hp_list[hp_i]);
            }
            hp_grid.innerHTML = hp_html;
        }

        function hp_loading() {
            hp_dot.className = 'hp_dot hp_wait';
            hp_state.innerHTML = '正在请求接口……';
            hp_error.style.display = 'none';
            hp_reload.disabled = true;
            var hp_sk = '';
            for (var hp_i = 0; hp_i < 8; hp_i++) {
                hp_sk += '<div class="hp_skeleton"></div>';
            }
            hp_grid.innerHTML = hp_sk;
        }

        function hp_loadData() {
            hp_loading();
            var hp_start = new Date().getTime();

            fetch(hp_url, {
                method: 'GET',
                headers: { 'Accept': 'application/json' }
            }).then(function (hp_res) {
                hp_code.innerHTML = hp_res.status + ' ' + hp_res.statusText;
                if (!hp_res.ok) {
                    throw new Error('接口返回异常，状态码 ' + hp_res.status);
                }
                return hp_res.json();
            }).then(function (hp_data) {
                hp_products = hp_data.products || [];
                hp_time.innerHTML = new Date().getTime() - hp_start;
                hp_count.innerHTML = hp_products.length;
                hp_dot.className = 'hp_dot';
                hp_state.innerHTML = '接口数据获取成功';
                hp_render();
            }).catch(function (hp_err) {
                hp_dot.className = 'hp_dot hp_err';
                hp_state.innerHTML = '接口请求失败';
                hp_count.innerHTML = 0;
                hp_error.style.display = 'block';
                hp_error.innerHTML = '请求失败：' + hp_escape(hp_err.message) +
                    '<br>可能原因：网络未连接或接口不可用，可点击“重新请求数据”重试。';
                hp_grid.innerHTML = '<div class="hp_empty">暂无数据</div>';
            }).then(function () {
                hp_reload.disabled = false;
            });
        }

        hp_reload.addEventListener('click', hp_loadData);
        hp_keyword.addEventListener('input', hp_render);

        hp_loadData();
    </script>
</body>
</html>
