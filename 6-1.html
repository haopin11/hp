<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>郝品 flex</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", "PingFang SC", "Segoe UI", sans-serif;
        }
        body {
            background: #f5f6fa;
            min-height: 100vh;
            padding: 40px 20px;
        }
        h2 {
            text-align: center;
            color: #252b48;
            font-size: 30px;
            letter-spacing: 3px;
            margin-bottom: 30px;
        }
        /* 四个父容器横向排列 */
        .flex {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
        }
        /* 父容器：白色背景 + 细灰色外边框 */
        .box {
            width: 200px;
            height: 200px;
            background: #ffffff;
            border: 1px solid #bbb;
            display: flex;
        }
        /* 子块通用样式：浅灰填充 + 黑色细边框 */
        .block {
            background: #e3e3e3;
            border: 1px solid #000;
        }

        /* 容器 1：1 个正方形子块，水平 + 垂直居中 */
        .box1 {
            align-items: center;
            justify-content: center;
        }
        .square {
            width: 70px;
            height: 70px;
        }

        /* 容器 2：2 个大小一致的横向矩形，上下垂直堆叠，整体居中 */
        .box2 {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
        }
        .rect {
            width: 90px;
            height: 44px;
        }

        /* 容器 3：4 个尺寸一样的横向矩形，2×2 网格，整体居中 */
        .box3 {
            display: grid;
            grid-template-columns: repeat(2, 66px);
            grid-template-rows: repeat(2, 36px);
            gap: 16px;
            place-content: center;
        }
        .small {
            width: 100%;
            height: 100%;
        }

        /* 容器 4：上 1 个通栏长矩形，下 2 个等宽短矩形，整体居中 */
        .box4 {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
        }
        .wide {
            width: calc(100% - 28px);
            height: 36px;
        }
        .row {
            display: flex;
            gap: 16px;
        }
        .short {
            width: 70px;
            height: 36px;
        }
    </style>
</head>
<body>
    <h2>郝品 flex</h2>
    <div class="flex">
        <!-- 容器 1：1 个子元素居中 -->
        <div class="box box1">
            <div class="block square"></div>
        </div>

        <!-- 容器 2：2 个子元素垂直排列居中 -->
        <div class="box box2">
            <div class="block rect"></div>
            <div class="block rect"></div>
        </div>

        <!-- 容器 3：4 个子元素均分 2×2 网格 -->
        <div class="box box3">
            <div class="block small"></div>
            <div class="block small"></div>
            <div class="block small"></div>
            <div class="block small"></div>
        </div>

        <!-- 容器 4：上 1 个宽块，下 2 个窄块 -->
        <div class="box box4">
            <div class="block wide"></div>
            <div class="row">
                <div class="block short"></div>
                <div class="block short"></div>
            </div>
        </div>
    </div>
</body>
</html>
