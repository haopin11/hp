<!DOCTYPE html>
<!--
姓名：郝品
日期：2026-11-02
使用的大模型：deepseek-v4-pro
功能名称：商品详情（fetch 接口数据，按 ID 获取）
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17-3 · 商品详情</title>
    <link rel="stylesheet" href="font/iconfont.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", "PingFang SC", "Segoe UI", sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            padding: 40px 16px;
        }
        .hp_container {
            max-width: 960px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
            overflow: hidden;
        }
        .hp_header {
            background: linear-gradient(135deg, #0f2027 0%, #2c5364 55%, #5f9ea0 100%);
            color: #fff;
            text-align: center;
            padding: 34px 24px 28px;
        }
        .hp_header h1 {
            font-size: 25px;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .hp_header p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.78);
            line-height: 1.8;
        }
        .hp_header code {
            display: inline-block;
            margin-top: 8px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 8px;
            padding: 5px 12px;
            font-family: Consolas, "Courier New", monospace;
            font-size: 13px;
            color: #ffd479;
        }
        .hp_main {
            padding: 26px 28px 40px;
        }
        .hp_toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 18px;
        }
        .hp_back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #eef6f7;
            border: 1px solid #d6e8eb;
            color: #3b8d99;
            border-radius: 999px;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s;
        }
        .hp_back:hover {
            background: #3b8d99;
            border-color: #3b8d99;
            color: #fff;
        }
        .hp_btn {
            background: #3b8d99;
            border: 1px solid #3b8d99;
            color: #fff;
            border-radius: 999px;
            padding: 10px 22px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .hp_btn:hover {
            background: #2c7180;
            border-color: #2c7180;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(59, 141, 153, 0.35);
        }
        .hp_btn:disabled {
            background: #b9cfd3;
            border-color: #b9cfd3;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .hp_error {
            display: none;
            background: #fff1f4;
            border: 1px solid #f6c9d5;
            color: #b5294d;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 16px;
        }
        .hp_skeleton {
            border-radius: 14px;
            background: linear-gradient(100deg, #eef5f7 30%, #f8fbfc 50%, #eef5f7 70%);
            background-size: 200% 100%;
            animation: hp_shine 1.1s linear infinite;
        }
        .hp_sk_img {
            height: 320px;
            margin-bottom: 16px;
        }
        .hp_sk_line {
            height: 22px;
            margin-bottom: 10px;
        }
        .hp_detail {
            animation: hp_fade 0.3s ease;
        }
        .hp_gallery {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .hp_main_img {
            flex: 1;
            min-width: 0;
        }
        .hp_main_img img {
            width: 100%;
            height: 360px;
            object-fit: cover;
            border-radius: 14px;
            border: 1px solid #e4eef1;
            background: #eef5f7;
            display: block;
        }
        .hp_thumbs {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .hp_thumbs img {
            width: 74px;
            height: 74px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid transparent;
            cursor: pointer;
            background: #eef5f7;
            transition: border-color 0.15s, transform 0.15s;
        }
        .hp_thumbs img:hover {
            transform: scale(1.05);
        }
        .hp_thumbs img.hp_on {
            border-color: #3b8d99;
        }
        .hp_head_row {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 8px;
        }
        .hp_title {
            font-size: 24px;
            font-weight: 700;
            color: #173f4f;
        }
        .hp_brand {
            font-size: 14px;
            color: #7a9aa3;
        }
        .hp_price_row {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 8px;
        }
        .hp_price {
            font-size: 30px;
            font-weight: 700;
            color: #e2762b;
        }
        .hp_price_old {
            font-size: 15px;
            color: #b3c3c8;
            text-decoration: line-through;
        }
        .hp_discount {
            font-size: 14px;
            color: #d6446e;
            font-weight: 700;
        }
        .hp_desc {
            font-size: 14px;
            color: #4a6a73;
            line-height: 1.8;
            margin-bottom: 12px;
        }
        .hp_tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        .hp_tag {
            background: #eef6f7;
            color: #3b8d99;
            border-radius: 999px;
            font-size: 12px;
            padding: 4px 12px;
        }
        .hp_info {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 24px;
        }
        .hp_info_item {
            background: #f6fbfc;
            border: 1px solid #e4eef1;
            border-radius: 10px;
            padding: 10px 14px;
        }
        .hp_info_item .hp_ik {
            display: block;
            font-size: 12px;
            color: #7a9aa3;
            margin-bottom: 2px;
        }
        .hp_info_item .hp_iv {
            display: block;
            font-size: 14px;
            color: #173f4f;
            font-weight: 700;
        }
        .hp_section_title {
            font-size: 18px;
            color: #173f4f;
            margin: 20px 0 12px;
            padding-left: 12px;
            border-left: 5px solid #3b8d99;
        }
        .hp_reviews {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .hp_review {
            background: #f6fbfc;
            border: 1px solid #e4eef1;
            border-radius: 12px;
            padding: 12px 14px;
        }
        .hp_review .hp_rhead {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .hp_review .hp_rname {
            font-size: 13px;
            font-weight: 700;
            color: #173f4f;
        }
        .hp_review .hp_rdate {
            font-size: 12px;
            color: #9db8bf;
        }
        .hp_review .hp_rrating {
            font-size: 12px;
            color: #d9a326;
            font-weight: 700;
        }
        .hp_review .hp_rcomment {
            font-size: 13px;
            color: #4a6a73;
            line-height: 1.7;
        }
        .hp_footer {
            text-align: center;
            padding: 16px 24px;
            background: #f0f7f8;
            color: #5f7f88;
            font-size: 13px;
            border-top: 1px solid #e0edef;
        }
        @keyframes hp_fade {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes hp_shine {
            from { background-position: 100% 0; }
            to { background-position: -100% 0; }
        }
        @media (max-width: 640px) {
            .hp_gallery {
                flex-direction: column;
            }
            .hp_thumbs {
                flex-direction: row;
            }
            .hp_main_img img {
                height: 260px;
            }
        }
    </style>
</head>
<body>
    <div class="hp_container">
        <div class="hp_header">
            <h1>商品详情 · fetch 接口数据</h1>
            <p>根据地址栏中的 id 参数，请求单个商品接口并渲染完整信息</p>
            <code id="hp_apiCode">GET https://dummyjson.com/products/1</code>
        </div>

        <div class="hp_main">
            <div class="hp_toolbar">
                <a class="hp_back" href="17-3.html">← 返回商品列表</a>
                <button class="hp_btn" id="hp_reload">重新请求数据</button>
            </div>

            <div class="hp_error" id="hp_error"></div>

            <div id="hp_detail">
                <div class="hp_skeleton hp_sk_img"></div>
                <div class="hp_skeleton hp_sk_line"></div>
                <div class="hp_skeleton hp_sk_line" style="width:60%;"></div>
                <div class="hp_skeleton hp_sk_line" style="width:80%;"></div>
            </div>
        </div>

        <div class="hp_footer">
            © 2026 郝品 | 高级网页设计课程作业
        </div>
    </div>

    <script>
        var hp_apiCode = document.getElementById('hp_apiCode');
        var hp_detail = document.getElementById('hp_detail');
        var hp_error = document.getElementById('hp_error');
        var hp_reload = document.getElementById('hp_reload');

        function hp_escape(hp_str) {
            return String(hp_str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function hp_price(hp_n) {
            return '$' + Number(hp_n).toFixed(2);
        }

        function hp_getId() {
            var hp_q = location.search;
            if (hp_q) {
                hp_q = hp_q.substring(1);
            }
            var hp_pairs = hp_q.split('&');
            for (var hp_i = 0; hp_i < hp_pairs.length; hp_i++) {
                var hp_parts = hp_pairs[hp_i].split('=');
                if (hp_parts[0] === 'id') {
                    return decodeURIComponent(hp_parts[1] || '');
                }
            }
            return null;
        }

        function hp_loading() {
            hp_error.style.display = 'none';
            hp_reload.disabled = true;
            hp_detail.innerHTML =
                '<div class="hp_skeleton hp_sk_img"></div>' +
                '<div class="hp_skeleton hp_sk_line"></div>' +
                '<div class="hp_skeleton hp_sk_line" style="width:60%;"></div>' +
                '<div class="hp_skeleton hp_sk_line" style="width:80%;"></div>';
        }

        function hp_render(p) {
            var hp_images = p.images || [];
            if (hp_images.length === 0) {
                hp_images = [p.thumbnail];
            }
            var hp_thumbsHtml = '';
            for (var hp_i = 0; hp_i < hp_images.length; hp_i++) {
                hp_thumbsHtml += '<img src="' + hp_escape(hp_images[hp_i]) + '" alt="缩略图" data-hp-src="' + hp_escape(hp_images[hp_i]) + '"' +
                    (hp_i === 0 ? ' class="hp_on"' : '') + '>';
            }
            var hp_tagsHtml = '';
            var hp_tags = p.tags || [];
            for (var hp_j = 0; hp_j < hp_tags.length; hp_j++) {
                hp_tagsHtml += '<span class="hp_tag">' + hp_escape(hp_tags[hp_j]) + '</span>';
            }
            var hp_reviewsHtml = '';
            var hp_reviews = p.reviews || [];
            for (var hp_k = 0; hp_k < hp_reviews.length; hp_k++) {
                var hp_r = hp_reviews[hp_k];
                hp_reviewsHtml += '<div class="hp_review">' +
                    '<div class="hp_rhead">' +
                        '<span class="hp_rname">' + hp_escape(hp_r.reviewerName) + '</span>' +
                        '<span class="hp_rdate">' + hp_escape(hp_r.date) + '</span>' +
                    '</div>' +
                    '<div class="hp_rrating">★ ' + hp_r.rating + ' / 5</div>' +
                    '<div class="hp_rcomment">' + hp_escape(hp_r.comment) + '</div>' +
                    '</div>';
            }
            var hp_reviewsSection = '';
            if (hp_reviewsHtml !== '') {
                hp_reviewsSection = '<h2 class="hp_section_title">用户评价</h2><div class="hp_reviews">' + hp_reviewsHtml + '</div>';
            }

            hp_detail.innerHTML = '<div class="hp_detail">' +
                '<div class="hp_gallery">' +
                    '<div class="hp_main_img"><img id="hp_mainImg" src="' + hp_escape(hp_images[0]) + '" alt="' + hp_escape(p.title) + '"></div>' +
                    '<div class="hp_thumbs" id="hp_thumbs">' + hp_thumbsHtml + '</div>' +
                '</div>' +
                '<div class="hp_head_row">' +
                    '<span class="hp_title">' + hp_escape(p.title) + '</span>' +
                    '<span class="hp_brand">' + hp_escape(p.brand) + '</span>' +
                '</div>' +
                '<div class="hp_price_row">' +
                    '<span class="hp_price">' + hp_price(p.price) + '</span>' +
                    '<span class="hp_discount">-' + p.discountPercentage + '%</span>' +
                    '<span class="hp_price_old">原价 ' + hp_price(Math.round(p.price / (1 - p.discountPercentage / 100) * 100) / 100) + '</span>' +
                '</div>' +
                '<div class="hp_desc">' + hp_escape(p.description) + '</div>' +
                '<div class="hp_tags">' + hp_tagsHtml + '</div>' +
                '<div class="hp_info">' +
                    '<div class="hp_info_item"><span class="hp_ik">分类</span><span class="hp_iv">' + hp_escape(p.category) + '</span></div>' +
                    '<div class="hp_info_item"><span class="hp_ik">评分</span><span class="hp_iv">★ ' + p.rating + ' / 5</span></div>' +
                    '<div class="hp_info_item"><span class="hp_ik">库存</span><span class="hp_iv">' + p.stock + ' 件</span></div>' +
                    '<div class="hp_info_item"><span class="hp_ik">起订量</span><span class="hp_iv">' + p.minimumOrderQuantity + '</span></div>' +
                    '<div class="hp_info_item"><span class="hp_ik">品牌</span><span class="hp_iv">' + hp_escape(p.brand) + '</span></div>' +
                    '<div class="hp_info_item"><span class="hp_ik">SKU</span><span class="hp_iv">' + hp_escape(p.sku) + '</span></div>' +
                    '<div class="hp_info_item"><span class="hp_ik">重量</span><span class="hp_iv">' + p.weight + ' g</span></div>' +
                    '<div class="hp_info_item"><span class="hp_ik">尺寸</span><span class="hp_iv">' + (p.dimensions ? p.dimensions.width + '×' + p.dimensions.height + '×' + p.dimensions.depth + ' cm' : '--') + '</span></div>' +
                    '<div class="hp_info_item"><span class="hp_ik">保修</span><span class="hp_iv">' + hp_escape(p.warrantyInformation || '--') + '</span></div>' +
                    '<div class="hp_info_item"><span class="hp_ik">发货</span><span class="hp_iv">' + hp_escape(p.shippingInformation || '--') + '</span></div>' +
                '</div>' +
                hp_reviewsSection +
                '</div>';

            var hp_thumbsEl = document.getElementById('hp_thumbs');
            var hp_mainImgEl = document.getElementById('hp_mainImg');
            if (hp_thumbsEl) {
                var hp_imgs = hp_thumbsEl.querySelectorAll('img');
                for (var hp_m = 0; hp_m < hp_imgs.length; hp_m++) {
                    hp_imgs[hp_m].addEventListener('click', function () {
                        hp_mainImgEl.src = this.getAttribute('data-hp-src');
                        for (var hp_n = 0; hp_n < hp_imgs.length; hp_n++) {
                            hp_imgs[hp_n].className = '';
                        }
                        this.className = 'hp_on';
                    });
                }
            }
        }

        function hp_loadData() {
            var hp_id = hp_getId();
            if (!hp_id) {
                hp_id = '1';
            }
            var hp_url = 'https://dummyjson.com/products/' + hp_id;
            hp_apiCode.innerHTML = 'GET ' + hp_url;
            hp_loading();

            fetch(hp_url, {
                method: 'GET',
                headers: { 'Accept': 'application/json' }
            }).then(function (hp_res) {
                if (!hp_res.ok) {
                    throw new Error('接口返回异常，状态码 ' + hp_res.status);
                }
                return hp_res.json();
            }).then(function (hp_data) {
                hp_render(hp_data);
            }).catch(function (hp_err) {
                hp_error.style.display = 'block';
                hp_error.innerHTML = '请求失败：' + hp_escape(hp_err.message) +
                    '<br>可能原因：网络未连接或商品不存在（ID 无效），可点击“重新请求数据”重试，或返回列表选择商品。';
                hp_detail.innerHTML = '';
            }).then(function () {
                hp_reload.disabled = false;
            });
        }

        hp_reload.addEventListener('click', hp_loadData);

        hp_loadData();
    </script>
</body>
</html>
