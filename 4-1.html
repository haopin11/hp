    <style>
        * {
            margin: 0;

        }
        body {
            /* 渐变背景 */
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            min-height: 100vh;
            padding: 50px 20px;
        }
        .container {
            max-width: 820px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(60, 80, 180, 0.15);

            font-size: 22px;
            color: #383c60;
            margin-bottom: 20px;
            border-left:5px solid #7b68ee;
            padding-left:14px;
        }
        .link-list {
            list-style: none;
        }
        .link-list li {
            margin:16px 0;
            padding:16px 20px;
            background-color: #f6f8ff;
            border-radius:10px;
            transition: all 0.3s ease;
            border:1px solid #e8ebfa;
        }
        .link-list li:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 18px rgba(123,104,238,0.18);
            background-color: #edeaff;
        }
        .link-list a {
            font-size:17px;
            color: #483d8b;
            text-decoration: none;
            font-weight: 600;
            display:block;
        }
        .link-list a::before{
            content:"📄 ";
        }
        .prompt-block {
            margin-top:20px;
            padding:20px;
            background: #212529;
            color: #89ffd9;
            border-radius:12px;
            white-space: pre-wrap;
            font-family: Consolas,monospace;
            font-size:14px;
            line-height:1.7;
            overflow-x:auto;
        }
        footer{
            margin-top:40px;
            text-align:center;
            color:#707494;
            font-size:15px;
        }
